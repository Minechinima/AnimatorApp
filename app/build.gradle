plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":core")

    implementation "org.joml:joml:${project.joml_version}"

    implementation "com.google.guava:guava:11.0.2"

    implementation platform("org.lwjgl:lwjgl-bom:$project.lwjgl_version")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    runtimeOnly "org.lwjgl:lwjgl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-windows"
    implementation "org.joml:joml:${project.joml_version}"

    //TODO do not import imgui here... core should abstract away imgui behind ui classes
    implementation("io.github.spair:imgui-java-binding:${project.imgui_version}")
    implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}")

    implementation("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
    implementation("io.github.spair:imgui-java-natives-linux:${project.imgui_version}")
    implementation("io.github.spair:imgui-java-natives-macos:${project.imgui_version}")
}

test {
    useJUnitPlatform()
}