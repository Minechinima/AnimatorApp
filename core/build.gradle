plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.apache.logging.log4j:log4j-bom:${project.log4j_version}")
    runtimeOnly 'org.apache.logging.log4j:log4j-core'
    implementation 'org.apache.logging.log4j:log4j-api:${log4j-api.version}'

    implementation project(":ui")
    annotationProcessor project(":ui")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'org.jetbrains:annotations:26.0.1'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'com.google.code.gson:gson:2.7'

    shadow(implementation("io.github.spair:imgui-java-binding:${project.imgui_version}"))
    shadow(implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}"))

    shadow(implementation("io.github.spair:imgui-java-natives-windows:${project.imgui_version}"))
    shadow(implementation("io.github.spair:imgui-java-natives-linux:${project.imgui_version}"))
    shadow(implementation("io.github.spair:imgui-java-natives-macos:${project.imgui_version}"))

    implementation "org.joml:joml:${project.joml_version}"

    implementation "com.google.guava:guava:11.0.2"

    implementation "com.google.auto.service:auto-service:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"

    implementation "com.palantir.javapoet:javapoet:0.6.0"

    implementation platform("org.lwjgl:lwjgl-bom:$project.lwjgl_version")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    runtimeOnly "org.lwjgl:lwjgl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-windows"
    implementation "org.joml:joml:${project.joml_version}"
}

test {
    useJUnitPlatform()
}